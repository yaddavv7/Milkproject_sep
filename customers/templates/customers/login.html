{% extends 'customers/base.html' %}

{% block title %}Login - Milk Distribution Customer Record System{% endblock %}

{% block content %}
<div class="card form-container">
    <h2 class="card-title">User Login</h2>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        {% if request.GET.next %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
        {% endif %}

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Login</button>
            <a href="{% url 'signup' %}" class="btn btn-secondary">Sign Up</a>
        </div>

        <div class="form-footer-link">
            Don't have an account? <a href="{% url 'signup' %}">Sign up here</a>
        </div>
    </form>
</div>
{% endblock %}
